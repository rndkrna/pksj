# ============================================================
# SIAKAD UMRAH - Nginx Reverse Proxy Configuration
# Implementasi DMZ dan TLS Termination
#
# Referensi Laporan PKSJ:
# - Tabel 3.1: "Pengguna melalui HTTPS menuju WAF/reverse proxy di DMZ"
# - FW-01: Internet → WAF/reverse proxy (TCP 443 HTTPS) → Allow
# - FW-02: Internet → Server aplikasi langsung → Deny
# - FW-03: WAF/reverse proxy → Server aplikasi (port 3000) → Allow
# - Tabel 4.2 (TLS dan sesi):
#   "HTTPS untuk kredensial/data sensitif; cookie Secure, HttpOnly"
# - R-04: Kerahasiaan (Security headers)
# - R-05: Ketersediaan (Rate limiting di perimeter)
#
# Tim PKSJ UMRAH
# ============================================================

# Konfigurasi worker sesuai jumlah CPU
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ============================================================
    # R-04 (Kerahasiaan): Sembunyikan versi server
    # Tabel 4.2: "Pesan kesalahan tidak membocorkan detail internal"
    # ============================================================
    server_tokens off;

    # Format log untuk audit (R-03)
    log_format security '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" '
                       '$request_time $upstream_response_time';

    access_log /var/log/nginx/access.log security;

    # Optimisasi
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ============================================================
    # R-05 (Ketersediaan): Rate Limiting di perimeter
    # Membatasi jumlah request per IP
    # ============================================================
    
    # Rate limit umum: 10 request/detik per IP
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    
    # Rate limit login: 5 request/menit per IP (SR-02: 5 gagal → lockout)
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # ============================================================
    # Upstream: Server Aplikasi SIAKAD
    # FW-03: Nginx → App (port 3000)
    # ============================================================
    upstream siakad_app {
        server app:3000;
        keepalive 32;
    }

    # ============================================================
    # Server Block: HTTP → HTTPS Redirect
    # FW-01: Hanya HTTPS yang diizinkan
    # ============================================================
    server {
        listen 80;
        server_name _;

        # Redirect semua HTTP ke HTTPS
        return 301 https://$host$request_uri;
    }

    # ============================================================
    # Server Block: HTTPS (Production)
    # Tabel 3.1 (Zona DMZ): TLS termination di reverse proxy
    # ============================================================
    server {
        listen 443 ssl;
        server_name siakad.umrah.ac.id localhost;

        # ============================================================
        # Tabel 4.2 (TLS dan sesi): Konfigurasi SSL/TLS
        # "HTTPS untuk kredensial/data sensitif"
        # ============================================================
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        
        # TLS 1.2 dan 1.3 saja (nonaktifkan protokol lama yang rentan)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        
        # SSL session caching
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # ============================================================
        # R-04 (Kerahasiaan): Security Headers
        # Tabel 4.2 (Hardening Host): Header keamanan tambahan
        # ============================================================
        
        # Mencegah clickjacking
        add_header X-Frame-Options "SAMEORIGIN" always;
        
        # Mencegah MIME type sniffing
        add_header X-Content-Type-Options "nosniff" always;
        
        # XSS Protection
        add_header X-XSS-Protection "1; mode=block" always;
        
        # Referrer Policy
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        # Content Security Policy
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' cdn.jsdelivr.net fonts.googleapis.com; font-src 'self' fonts.gstatic.com cdn.jsdelivr.net; img-src 'self' data:;" always;
        
        # HSTS (HTTP Strict Transport Security)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        
        # Permissions Policy
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # ============================================================
        # R-05 (Ketersediaan): Batasan ukuran request
        # Mencegah upload berlebihan
        # ============================================================
        client_max_body_size 1m;
        client_body_timeout 10s;
        client_header_timeout 10s;

        # ============================================================
        # FW-03: Proxy ke Server Aplikasi SIAKAD
        # Tabel 3.1 (Zona DMZ → Zona Aplikasi)
        # ============================================================
        
        # Endpoint login: Rate limit ketat (SR-02)
        location /auth/login {
            limit_req zone=login burst=3 nodelay;
            limit_req_status 429;
            
            proxy_pass http://siakad_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static files (CSS, JS) — cache lebih lama
        location /public {
            proxy_pass http://siakad_app;
            proxy_set_header Host $host;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # Semua endpoint lainnya
        location / {
            limit_req zone=general burst=20 nodelay;
            limit_req_status 429;
            
            proxy_pass http://siakad_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeout settings
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ============================================================
        # FW-02: Blokir akses langsung ke resource sensitif
        # "Mencegah bypass terhadap lapisan depan"
        # ============================================================
        
        # Blokir akses ke file environment dan konfigurasi
        location ~ /\. {
            deny all;
            return 404;
        }

        # Blokir akses ke file backup
        location ~* \.(sql|bak|backup|log)$ {
            deny all;
            return 404;
        }

        # ============================================================
        # Custom error pages (R-04: Non-disclosure)
        # ============================================================
        error_page 429 /429.html;
        location = /429.html {
            default_type text/html;
            return 429 '<!DOCTYPE html><html><head><title>429 - Terlalu Banyak Permintaan</title></head><body><h1>429 - Terlalu Banyak Permintaan</h1><p>Anda telah melebihi batas permintaan. Silakan coba lagi nanti.</p></body></html>';
        }

        error_page 502 503 504 /50x.html;
        location = /50x.html {
            default_type text/html;
            return 502 '<!DOCTYPE html><html><head><title>Layanan Tidak Tersedia</title></head><body><h1>Layanan Sedang Tidak Tersedia</h1><p>Silakan coba lagi dalam beberapa saat.</p></body></html>';
        }
    }
}
