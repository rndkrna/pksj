# ============================================================
# SIAKAD UMRAH - Kubernetes Secret Template
# Referensi: Tabel 4.2 (Rahasia Konfigurasi)
# "Simpan kredensial di konfigurasi terlindungi/secret store; jangan commit ke repositori"
# Catatan: Di-generate secara dinamis saat deployment melalui:
#   kubectl create secret generic siakad-secret --from-env-file=.env -n siakad
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: siakad-secret
  namespace: siakad
  labels:
    app: siakad
    tier: app
type: Opaque
stringData:
  # Placeholder aman: Diinjeksikan saat runtime melalui Secret Store / Vault / CI Pipeline
  DB_USER: "siakad_app"
  DB_PASSWORD: "CHANGE_ME_AT_RUNTIME_VIA_VAULT_OR_ENV"
  DB_ROOT_PASSWORD: "CHANGE_ME_AT_RUNTIME_VIA_VAULT_OR_ENV"
  SESSION_SECRET: "CHANGE_ME_AT_RUNTIME_VIA_VAULT_OR_ENV"
